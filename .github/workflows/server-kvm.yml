name: Real server installation on ephemeral KVM

on:
  push:
    branches: [qa/server-debug-20261017]
  workflow_dispatch:
    inputs:
      tor_mode:
        description: Explicit production Tor route (no fallback)
        required: true
        type: choice
        default: direct
        options: [direct, public-obfs4]

permissions:
  contents: read

concurrency:
  group: server-kvm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  server:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CI_PUBLIC_REPOSITORY: ${{ github.event.repository.private == false }}
      CI_TOR_MODE: ${{ inputs.tor_mode || 'direct' }}
    steps:
      - name: Initialize this job's state path
        shell: bash
        run: |
          printf 'CI_STATE_FILE=%s/oniondesk-server-kvm-%s-%s.json\n' "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: Check out the exact tested source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          lfs: false
      - name: Verify the evidence boundary
        run: python3 -B -m unittest discover -s tests/ci/server-kvm -p 'test_*.py' -v
      - name: Install the unmodified server in fresh Debian 13 with real KVM
        run: python3 -B tests/ci/server-kvm/run.py run
      - name: Remove only this job's container and image
        if: always()
        run: python3 -B tests/ci/server-kvm/run.py cleanup
      - name: Save bounded public evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: server-kvm-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            server-kvm-evidence/*.json
            server-kvm-evidence/*.png
            server-kvm-evidence/*.cms
          retention-days: 1
          if-no-files-found: error
          compression-level: 6
