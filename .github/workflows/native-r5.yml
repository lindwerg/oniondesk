name: Native R5 — загрузка и первый запуск

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Набор платформ для проверки
        type: choice
        required: true
        default: all
        options: [all, linux, windows, windows-debug, windows-gui-component]

permissions:
  contents: read

jobs:
  native:
    if: github.event.repository.private == false && github.repository == 'lindwerg/oniondesk'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.suite == 'linux' && '[{"distribution":"linux-x64","runner":"ubuntu-24.04","python_arch":"x64"},{"distribution":"linux-arm64","runner":"ubuntu-24.04-arm","python_arch":"arm64"}]' || (inputs.suite == 'windows' || inputs.suite == 'windows-debug' || inputs.suite == 'windows-gui-component') && '[{"distribution":"windows-x64","runner":"windows-2022","python_arch":"x64"}]' || '[{"distribution":"windows-x64","runner":"windows-2022","python_arch":"x64"},{"distribution":"linux-x64","runner":"ubuntu-24.04","python_arch":"x64"},{"distribution":"linux-arm64","runner":"ubuntu-24.04-arm","python_arch":"arm64"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    concurrency:
      group: native-r5-${{ github.ref }}-${{ matrix.distribution }}
      cancel-in-progress: false
    env:
      CI_PUBLIC_REPOSITORY: ${{ github.event.repository.private == false }}
      CI_DISTRIBUTION: ${{ matrix.distribution }}
    steps:
      - name: Назначить приватные каталоги этого запуска
        shell: python
        run: |
          import os
          from pathlib import Path
          temporary = Path(os.environ['RUNNER_TEMP'])
          suffix = os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT']
          state = temporary / ('oniondesk-native-' + suffix + '-' + os.environ['CI_DISTRIBUTION'] + '.json')
          browsers = temporary / ('oniondesk-native-browsers-' + suffix)
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as output:
              output.write('CI_STATE_FILE=' + str(state) + '\n')
              output.write('PLAYWRIGHT_BROWSERS_PATH=' + str(browsers) + '\n')
      - name: Получить точную проверяемую версию
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            tests/ci/native-r5
            .github/workflows
          sparse-checkout-cone-mode: true
      - name: Подготовить Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          architecture: ${{ matrix.python_arch }}
          cache: ''
      - name: Проверить границы harness
        run: python -B -m unittest discover -s tests/ci/native-r5 -p 'test_*.py' -v
      - name: Установить зависимости теста
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r tests/ci/native-r5/requirements.txt
      - name: Подготовить точный Go для диагностического probe
        if: inputs.suite == 'windows-debug'
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.2'
          architecture: x64
          cache: false
      - name: Подготовить браузер с включённой песочницей
        if: inputs.suite != 'windows-debug'
        run: python -B tests/ci/native-r5/run.py provision
      - name: Windows — короткая диагностика cache owner и frozen engine
        if: inputs.suite == 'windows-debug'
        timeout-minutes: 5
        run: python -B tests/ci/native-r5/run.py diagnose-windows
      - name: Windows — нативные тесты, установка, первое действие и выход
        if: runner.os == 'Windows' && inputs.suite != 'windows-debug' && inputs.suite != 'windows-gui-component'
        run: python -B tests/ci/native-r5/run.py run ${{ matrix.distribution }}
      - name: Windows — компонент GUI, установка, первое действие и выход
        if: runner.os == 'Windows' && inputs.suite == 'windows-gui-component'
        run: python -B tests/ci/native-r5/run.py run-windows-gui-component
      - name: Linux — native UI, первое действие и выход
        if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 1280x900x24' python -B tests/ci/native-r5/run.py run ${{ matrix.distribution }}
      - name: Удалить только ресурсы этого теста
        if: always()
        run: python -B tests/ci/native-r5/run.py cleanup
      - name: Проверить публичную границу и лимит 8 МиБ
        id: boundary
        if: always()
        run: python -B tests/ci/native-r5/run.py seal
      - name: Сохранить ограниченные публичные доказательства
        if: always() && steps.boundary.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-r5-${{ matrix.distribution }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: native-r5-evidence
          retention-days: 1
          if-no-files-found: error
          compression-level: 6
